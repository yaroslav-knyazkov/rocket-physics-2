<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Референс</title>
<!-- Board card for a reference screenshot: lab/ref.html?img=<round>-refs/<file>.png
     The image fills the card width (a bare PNG in the board iframe shows only its top-left corner). -->
<style>
  html, body { margin: 0; background: #f4f5f7; }
  img { display: block; width: 100%; height: auto; }
  p { font: 14px/1.4 system-ui, sans-serif; color: #555; padding: 16px; }
</style>
</head>
<body>
<script>
  var src = new URLSearchParams(location.search).get('img') || '';
  if (/^[\w.\/-]+\.(png|jpe?g|webp)$/i.test(src) && src.indexOf('..') === -1) {
    var img = document.createElement('img'); img.src = src; img.alt = 'Скриншот референса'; document.body.appendChild(img);
  } else {
    var p = document.createElement('p'); p.textContent = 'Нет картинки: ожидается ?img=<папка>/<файл>.png'; document.body.appendChild(p);
  }
</script>
</body>
</html>
